<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUNAKI KAZUKO | Portfolio</title>
  <meta name="description" content="デザインと写真で、日常にちょっとしたワクワクを。FUNAKI KAZUKOのポートフォリオ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <!-- 共通の設定(ヘッダー・ナビ・フッター・ページ遷移) -->
  <link rel="stylesheet" href="common.css">

  <!-- このページ専用の設定 -->
  <style>
    /* ---------- Image blocks ---------- */
    /* 画像を差し替えるときは、各ブロックの style="--src:url('...')" のパスを変更してください。 */
    .photo {
      --src: none;
      background-image: var(--src), var(--fallback);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ---------- Hero ---------- */
    .hero {
      height: 170px;
      --fallback: linear-gradient(100deg, #f4d3df 0%, #f7e3d0 30%, #e8e9c9 55%, #f3c9db 80%, #f8ddd5 100%);
      animation: hero-color 3s ease-out 0.5s both;
    }

    @keyframes hero-color {
      from {
        filter: grayscale(1);
      }

      to {
        filter: grayscale(0);
      }
    }

    /* ---------- Section shared ---------- */
    .section-title {
      margin: 0;
      font-family: var(--font-en);
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }

    .view-more {
      display: inline-block;
      font-family: var(--font-en);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.06em;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--line);
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .view-more:hover,
    .view-more:focus-visible {
      color: #f95790;
      border-bottom-color: #f95790;
    }

    /* ---------- About ---------- */
    .about {
      margin-top: 60px;
    }

    .about-top {
      display: grid;
      grid-template-columns: 1fr 145px;
      align-items: center;
    }

    .about-top .section-title {
      justify-self: center;
    }

    .about-photo {
      aspect-ratio: 160 / 152;
      margin-right: 35px;
      /* この数値を大きくするほど左に寄る */
      --fallback: none;
      background-size: contain;
      /* 切れずに全体を表示 */
    }

    .about-body {
      padding: 24px var(--pad) 0;
    }

    .about-body p {
      margin: 0 0 1.4em;
    }

    .about-body .lead {
      font-weight: 500;
    }

    .about-more {
      text-align: center;
      margin-top: -10px;
    }

    /* ---------- Design / Photo ---------- */
    .gallery {
      margin-top: 55px;
      text-align: center;
    }

    .gallery+.gallery {
      margin-top: 55px;
    }

    .gallery-inner {
      width: 160px;
      margin: 24px auto 0;
    }

    .gallery .thumb {
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    .gallery .view-more {
      margin-top: 10px;
      float: right;
    }

    .gallery-inner::after {
      content: "";
      display: block;
      clear: both;
    }

    .thumb-design {
      --fallback: linear-gradient(160deg, #ffb38a 0%, #f98a5a 35%, #ffd2b0 60%, #e9602f 100%);
    }

    .thumb-photo {
      --fallback: linear-gradient(90deg, #f1f1ee 0%, #dcdcd8 45%, #8b8780 70%, #efefec 100%);
    }

    /* ---------- PC ---------- */
    @media (min-width: 768px) {
      .hero {
        height: 330px;
      }

      .about {
        margin-top: 100px;
      }

      .about-top {
        grid-template-columns: 1fr 280px;
      }

      .about-photo {
        aspect-ratio: 280 / 266;
      }

      .about-body {
        padding-top: 36px;
        max-width: 520px;
      }

      .about-more {
        text-align: right;
        margin-top: -10px;
      }

      .gallery-inner {
        width: 260px;
      }

      .section-title {
        font-size: 24px;
      }
    }

    /* 「動きを減らす」設定の人には、モノクロ→カラーの動きを止める */
    @media (prefers-reduced-motion: reduce) {
      .hero {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <a class="logo" href="#top" id="top">FUNAKI KAZUKO</a>
      <button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav class="menu" id="menu" aria-label="メインメニュー">
      <ul>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="design.html">DESIGN</a></li>
        <li><a href="photo.html">PHOTO</a></li>
        <li><a href="https://www.instagram.com/o.h.a.n.a.0708/" target="_blank" rel="noopener">INSTAGRAM</a></li>
      </ul>
    </nav>

    <main>
      <!-- Hero -->
      <div class="photo hero" role="img" aria-label="コスモス" style="--src:url('./img/kosumosu.JPG')"></div>

      <!-- About -->
      <section class="about" id="about">
        <div class="about-top">
          <h2 class="section-title">ABOUT</h2>
          <div class="photo about-photo" role="img" aria-label="ABOUT画像" style="--src:url('./img/about_illust.svg')">
          </div>
        </div>
        <div class="about-body">
          <p class="lead">デザインと写真で、日常にちょっとしたワクワクを。</p>
          <p>見た人の日常に小さなときめきや、好奇心を生み出したい。そんな想いを込めて、ものづくりをしています。</p>
          <p>好奇心旺盛で、素直な性格です。</p>
          <div class="about-more"><a class="view-more" href="about.html">VIEW MORE</a></div>
        </div>
      </section>

      <!-- Design -->
      <section class="gallery" id="design">
        <h2 class="section-title">DESIGN</h2>
        <div class="gallery-inner">
          <div class="photo thumb thumb-design" role="img" aria-label="私の名刺"
            style="--src:url('./img/wasanbon_mockup.jpg')">
          </div>
          <a class="view-more" href="design.html">VIEW MORE</a>
        </div>
      </section>

      <!-- Photo -->
      <section class="gallery" id="photo">
        <h2 class="section-title">PHOTO</h2>
        <div class="gallery-inner">
          <div class="photo thumb thumb-photo" role="img" aria-label="猫" style="--src:url('./img/rousokuyo.JPG')"></div>
          <a class="view-more" href="photo.html">VIEW MORE</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a class="insta" href="https://www.instagram.com/o.h.a.n.a.0708/" target="_blank" rel="noopener"
        aria-label="Instagram">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#feda75" />
              <stop offset="0.3" stop-color="#fa7e1e" />
              <stop offset="0.55" stop-color="#d62976" />
              <stop offset="0.8" stop-color="#962fbf" />
              <stop offset="1" stop-color="#4f5bd5" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#ig)" />
          <rect x="7.5" y="7.5" width="17" height="17" rx="5" fill="none" stroke="#fff" stroke-width="2" />
          <circle cx="16" cy="16" r="4" fill="none" stroke="#fff" stroke-width="2" />
          <circle cx="21.2" cy="10.8" r="1.2" fill="#fff" />
        </svg>
      </a>
      <p class="copyright">©ohana2026</p>
    </footer>
  </div>

  <script src="common.js"></script>
</body>

</html>
