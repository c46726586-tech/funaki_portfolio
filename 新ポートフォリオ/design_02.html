<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>抹茶ラテPRバナー | FUNAKI KAZUKO</title>
    <meta name="description" content="抹茶ラテを紹介するPRバナーの制作実績です。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- 共通の設定(ヘッダー・ナビ・フッター・ページ遷移) -->
    <link rel="stylesheet" href="common.css">

    <!-- このページ専用の設定 -->
    <style>
        /* ---------- ふわっと浮き出る動き ---------- */
        /* .fade を付けた要素が、--i の順番に、下から浮かび上がります。 */
        .fade {
            opacity: 0;
            transform: translateY(24px);
            filter: blur(6px);
            animation: float-in 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            animation-delay: calc(var(--i, 0) * 0.2s + 0.1s);
        }

        @keyframes float-in {
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* 「動きを減らす」設定の人には、動きなしで表示 */
        @media (prefers-reduced-motion: reduce) {
            .fade {
                opacity: 1;
                transform: none;
                filter: none;
                animation: none;
            }
        }

        /* ---------- 詳細ページ ---------- */
        .detail {
            padding: 44px 14.7vw 0;
        }

        /* 作品画像(正方形・画面幅の半分) */
        .detail-img {
            --src: none;
            --fallback: #ebe5e5;
            width: 50vw;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            /* 画面の中央に置く */
            background-image: var(--src), linear-gradient(var(--fallback), var(--fallback));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 作品名 */
        .detail-title {
            margin: 22px 0 0;
            font-family: var(--font-ja);
            font-weight: 400;
            font-size: clamp(13px, 3.9vw, 15px);
            line-height: 1.6;
            letter-spacing: 0.15em;
            text-align: center;
        }

        /* 説明文 */
        .detail-text {
            margin: 24px 0 0;
            font-size: clamp(12px, 3.6vw, 14px);
            font-weight: 400;
            line-height: 1.75;
            letter-spacing: 0.12em;
        }

        /* 制作時間 */
        .detail-time {
            margin: 28px 0 0;
            font-size: clamp(12px, 3.6vw, 14px);
            font-weight: 400;
            letter-spacing: 0.12em;
            text-align: center;
        }

        /* コピーライトの上の余白(Instagramアイコンが無いので0に) */
        .footer .copyright {
            margin-top: 0;
        }

        /* ---------- PC ---------- */
        @media (min-width: 768px) {
            .detail {
                padding: 56px 40px 0;
            }

            .detail-img {
                width: 360px;
            }

            .detail-title {
                margin-top: 28px;
                font-size: 16px;
            }

            .detail-text,
            .detail-time {
                max-width: 420px;
                margin-left: auto;
                margin-right: auto;
                font-size: 14px;
            }

            .detail-text p {
                margin: 0 0 0.5em;
                /* 段落の間隔。カンプのように詰めるなら 0 */
            }

            .detail-text p:last-child {
                margin-bottom: 0;
            }

            .detail-text {
                word-break: auto-phrase;
                /* 言葉のまとまりで折り返す */
                text-wrap: pretty;
                /* 1文字だけ残る行を避ける */
                overflow-wrap: break-word;
                /* 長い英単語で、はみ出さないようにする */
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <header class="header">
            <a class="logo" href="index.html">FUNAKI KAZUKO</a>
            <button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="menu">
                <span></span><span></span><span></span>
            </button>
        </header>

        <nav class="menu" id="menu" aria-label="メインメニュー">
            <ul>
                <li><a href="index.html">TOP</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="design.html">DESIGN</a></li>
                <li><a href="photo.html">PHOTO</a></li>
                <li><a href="https://www.instagram.com/o.h.a.n.a.0708/" target="_blank" rel="noopener">INSTAGRAM</a>
                </li>
            </ul>
        </nav>

        <main class="detail">
            <div class="detail-img fade" role="img" aria-label="抹茶ラテのPRバナー"
                style="--i:0; --src:url('./img/matcha_latte.jpg'); --fallback:#e6d8c3"></div>

            <h1 class="detail-title fade" style="--i:1">「抹茶ラテPRバナー」</h1>

            <div class="detail-text">
                <p class="fade" style="--i:2">AIでベースとなる構成・素材を生成したうえでレイアウトや配色を細かく調整し、視認性を高めた抹茶ラテのPRデザインです。</p>
                <p class="fade" style="--i:3">「抹茶、濃いめ」というメインコピーを左上に大きく配置し、一目で抹茶の商品であることが伝わる構成を意識しました。</p>
            </div>

            <p class="detail-time fade" style="--i:5">制作時間:1.5h</p>
        </main>
        <footer class="footer">
            <p class="copyright">©ohana2026</p>
        </footer>

    </div>

    <script src="common.js"></script>
</body>

</html>
