<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>デザイン | FUNAKI KAZUKO</title>
    <meta name="description" content="FUNAKI KAZUKOのデザイン作品。バナーやチラシなどの制作実績です。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- 共通の設定(ヘッダー・ナビ・フッター・ページ遷移) -->
    <link rel="stylesheet" href="common.css">

    <!-- このページ専用の設定 -->
    <style>
        /* ---------- タイトルが横からスライドして出る動き ---------- */
        /* .slide を付けた行が、--i の順番に、左からスライドして現れます。
       右から出したいときは、translateX(-48px) を translateX(48px) にしてください。 */
        .slide {
            display: block;
            opacity: 0;
            transform: translateX(-48px);
            animation: slide-in 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            animation-delay: calc(var(--i, 0) * 0.18s + 0.15s);
        }

        @keyframes slide-in {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ---------- デザイン ---------- */
        .design-page {
            padding: 24px clamp(24px, 10.5vw, 60px) 0;
            /* PHOTOと同じ余白 */
        }

        .page-title {
            margin: 0 0 clamp(40px, 17vw, 72px);
            padding: 4px 0 0 12px;
            /* PHOTOのタイトルと同じ位置 */
            font-family: var(--font-ja);
            font-weight: 400;
            font-size: clamp(22px, 6.5vw, 36px);
            line-height: 1.6;
            letter-spacing: 0.4em;
        }

        /* 作品は2列。横長(約3:2)のバナーを並べる */
        .works {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(12px, 5.6vw, 24px);
        }

        .work {
            --src: none;
            --fallback: #ebe5e5;
            aspect-ratio: 1 / 1;
            /* 正方形 */
            background-image: var(--src), linear-gradient(var(--fallback), var(--fallback));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .item {
            margin: 0;
        }

        .works a.work {
            display: block;
        }

        .item figcaption {
            margin-top: 7px;
            font-size: 11px;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: 0.1em;
        }


        /* コピーライトの上の余白(Instagramアイコンが無いので0に) */
        .footer .copyright {
            margin-top: 0;
        }

        /* ---------- PC ---------- */
        @media (min-width: 768px) {

            /* PHOTOと同じ大きさにそろえる(中身の幅520px) */
            .design-page {
                max-width: 600px;
                /* 中身520px + 左右の余白40px×2 */
                margin: 0 auto;
                padding: 56px 40px 0;
            }

            .page-title {
                margin-bottom: 72px;
                padding-left: 16px;
                font-size: 36px;
            }

            .works {
                gap: 20px;
            }

            .item figcaption {
                font-size: 13px;
            }
        }

        /* 「動きを減らす」設定の人には、動きなしで表示 */
        @media (prefers-reduced-motion: reduce) {
            .slide {
                opacity: 1;
                transform: none;
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <header class="header">
            <a class="logo" href="index.html">FUNAKI KAZUKO</a>
            <button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="menu">
                <span></span><span></span><span></span>
            </button>
        </header>

        <nav class="menu" id="menu" aria-label="メインメニュー">
            <ul>
                <li><a href="index.html">TOP</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="design.html">DESIGN</a></li>
                <li><a href="photo.html">PHOTO</a></li>
                <li><a href="https://www.instagram.com/o.h.a.n.a.0708/" target="_blank" rel="noopener">INSTAGRAM</a>
                </li>
            </ul>
        </nav>

        <main class="design-page">
            <h1 class="page-title">
                <span class="slide" style="--i:0">デ</span>
                <span class="slide" style="--i:1">ザイン</span>
                <span class="page-sub slide" style="--i:2" lang="en">DESIGN</span>
            </h1>

            <div class="works">
                <figure class="item">
                    <a class="work" href="design_01.html" aria-label="和三盆PRバナー"
                        style="--src:url('./img/wasanbon_mockup.jpg'); --fallback:#e6d8c3"></a>
                    <figcaption>和三盆PRバナー</figcaption>
                </figure>

                <figure class="item">
                    <a class="work" href="design_02.html" aria-label="抹茶ラテPRバナー"
                        style="--src:url('./img/matcha_mockup.jpg'); --fallback:#2f6b3a"></a>
                    <figcaption>抹茶ラテPRバナー</figcaption>
                </figure>
                <figure class="item">
                    <a class="work" href="design_03.html" aria-label="わたしの名刺"
                        style="--src:url('./img/my_meishi_mockup.jpg'); --fallback:#2f6b3a"></a>
                    <figcaption>わたしの名刺</figcaption>
                </figure>
                <figure class="item">
                    <a class="work" href="design_04.html" aria-label="こども食堂名刺"
                        style="--src:url('./img/small_meisi.jpg'); --fallback:#2f6b3a"></a>
                    <figcaption>こども食堂名刺</figcaption>
                </figure>
                <!-- 増やす場合は、同じ形で足してください -->
            </div>
        </main>

        <footer class="footer">
            <p class="copyright">©ohana2026</p>
        </footer>

    </div>

    <script src="common.js"></script>
</body>

</html>
